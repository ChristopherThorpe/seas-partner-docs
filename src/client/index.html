<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      :root {
        --fg: #1f2328;
        --muted: #59636e;
        --bg: #ffffff;
        --panel: #f6f8fa;
        --accent: #a51c30;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6edf3;
          --muted: #9198a1;
          --bg: #0d1117;
          --panel: #151b23;
          --accent: #ff7b8c;
        }
      }
      body {
        margin: 0;
        padding: 24px 16px;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        color: var(--accent);
      }
      pre {
        padding: 12px;
        border-radius: 6px;
        background: var(--panel);
        white-space: pre-wrap;
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SEAS Partner Docs</h1>
      <p class="muted">Development build. This page reports who Apps Script thinks you are.</p>
      <pre id="who">Loading…</pre>
    </main>
    <!-- @inline-script -->
  </body>
</html>
